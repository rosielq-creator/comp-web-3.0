<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Explore GreenTomato AI Artists by location, language, gender and creative discipline."
    />
    <title>Artists — GreenTomato</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./artists.css" />
    <script src="./artists.js" defer></script>
  </head>
  <body class="artists-page">
    <header class="site-header">
      <a class="brand" href="./" aria-label="GreenTomato home">
        <img src="./assets/greentomato-logo.svg" alt="GreenTomato" />
      </a>

      <nav class="desktop-nav" aria-label="Primary navigation">
        <a class="is-current" href="./artists.html" aria-current="page">Artists</a>
        <a href="./#work">Work</a>
        <a href="./#services">Services</a>
        <a href="./#about">About</a>
        <a href="./#contact">Contact</a>
        <a href="https://gtomato.com/" target="_blank" rel="noreferrer">
          Company <span aria-hidden="true">↗</span>
        </a>
      </nav>

      <button class="language-button" type="button" aria-expanded="false">
        <span>EN</span>
        <svg viewBox="0 0 12 8" aria-hidden="true">
          <path d="m1 1 5 5 5-5" />
        </svg>
      </button>
    </header>

    <main class="artist-directory">
      <header class="directory-heading">
        <div>
          <p class="directory-kicker">GreenTomato / AI Artists</p>
          <h1>Artists</h1>
        </div>
        <p>
          Distinct digital personalities, ready for contemporary brand
          storytelling.
        </p>
      </header>

      <section class="directory-controls" aria-label="Filter artists">
        <label class="filter-control">
          <span class="sr-only">Gender</span>
          <select data-artist-filter="gender">
            <option value="">Gender</option>
            <option value="female">Female</option>
            <option value="male">Male</option>
          </select>
        </label>

        <label class="filter-control">
          <span class="sr-only">Location</span>
          <select data-artist-filter="location">
            <option value="">Location</option>
            <option value="guangdong">Guangdong</option>
            <option value="hong kong">Hong Kong</option>
            <option value="los angeles">Los Angeles</option>
            <option value="new york">New York</option>
            <option value="paris">Paris</option>
            <option value="seoul">Seoul</option>
            <option value="tokyo">Tokyo</option>
          </select>
        </label>

        <label class="filter-control">
          <span class="sr-only">Language</span>
          <select data-artist-filter="language">
            <option value="">Language</option>
            <option value="cantonese">Cantonese</option>
            <option value="english">English</option>
            <option value="korean">Korean</option>
            <option value="mandarin">Mandarin</option>
          </select>
        </label>

        <label class="filter-control filter-control--wide">
          <span class="sr-only">Creative talent</span>
          <select data-artist-filter="talent">
            <option value="">Creative Talent</option>
            <option value="art">Art</option>
            <option value="beauty">Beauty</option>
            <option value="fashion">Fashion</option>
            <option value="film">Film</option>
            <option value="lifestyle">Lifestyle</option>
            <option value="music">Music</option>
            <option value="photography">Photography</option>
            <option value="sport">Sport</option>
            <option value="travel">Travel</option>
            <option value="wellness">Wellness</option>
          </select>
        </label>

        <button class="reset-filters" type="button">Reset</button>
        <p class="result-count" aria-live="polite"><span>5</span> Artists</p>
      </section>

      <section class="artist-grid" aria-label="Artist directory">
        <article
          class="artist-card"
          data-artist-card
          data-gender="female"
          data-location="paris new york seoul"
          data-language="english korean"
          data-talent="luxury fashion high fashion art"
        >
          <a class="artist-card-link" href="./maya.html" aria-label="View Maya profile">
            <figure>
              <img src="./assets/artists/maya.png" alt="Maya" fetchpriority="high" />
              <figcaption class="artist-overlay">
                <p>Luxury Fashion Artist</p>
                <dl>
                  <div><dt>Location</dt><dd>Paris · New York · Seoul</dd></div>
                  <div><dt>Language</dt><dd>English · Korean</dd></div>
                  <div><dt>Gender</dt><dd>Female</dd></div>
                  <div><dt>Creative Talent</dt><dd>Fashion · Art</dd></div>
                </dl>
              </figcaption>
            </figure>
            <h2>Maya</h2>
          </a>
        </article>

        <article
          class="artist-card"
          data-artist-card
          data-gender="female"
          data-location="los angeles seoul"
          data-language="english korean"
          data-talent="music fashion city culture"
        >
          <figure>
            <img src="./assets/artists/amber.png" alt="Amber" loading="lazy" />
            <figcaption class="artist-overlay">
              <p>Music Producer / Fashion Artist</p>
              <dl>
                <div><dt>Location</dt><dd>Los Angeles · Seoul</dd></div>
                <div><dt>Language</dt><dd>English · Korean</dd></div>
                <div><dt>Gender</dt><dd>Female</dd></div>
                <div><dt>Creative Talent</dt><dd>Music · Fashion</dd></div>
              </dl>
            </figcaption>
          </figure>
          <h2>Amber</h2>
        </article>

        <article
          class="artist-card"
          data-artist-card
          data-gender="female"
          data-location="seoul"
          data-language="korean english"
          data-talent="beauty wellness lifestyle"
        >
          <figure>
            <img src="./assets/artists/ooona.png" alt="Ooona" loading="lazy" />
            <figcaption class="artist-overlay">
              <p>Beauty / Wellness Artist</p>
              <dl>
                <div><dt>Location</dt><dd>Seoul</dd></div>
                <div><dt>Language</dt><dd>Korean · English</dd></div>
                <div><dt>Gender</dt><dd>Female</dd></div>
                <div><dt>Creative Talent</dt><dd>Beauty · Wellness · Lifestyle</dd></div>
              </dl>
            </figcaption>
          </figure>
          <h2>Ooona</h2>
        </article>

        <article
          class="artist-card"
          data-artist-card
          data-gender="male"
          data-location="hong kong seoul tokyo"
          data-language="cantonese mandarin english"
          data-talent="film fashion photography travel"
        >
          <figure>
            <img src="./assets/artists/noah.png" alt="Noah" loading="lazy" />
            <figcaption class="artist-overlay">
              <p>Film / Fashion Artist</p>
              <dl>
                <div><dt>Location</dt><dd>Hong Kong · Seoul · Tokyo</dd></div>
                <div><dt>Language</dt><dd>Cantonese · Mandarin · English</dd></div>
                <div><dt>Gender</dt><dd>Male</dd></div>
                <div><dt>Creative Talent</dt><dd>Film · Fashion · Photography</dd></div>
              </dl>
            </figcaption>
          </figure>
          <h2>Noah</h2>
        </article>

        <article
          class="artist-card"
          data-artist-card
          data-gender="male"
          data-location="guangdong"
          data-language="mandarin cantonese english"
          data-talent="lifestyle fashion sport travel photography"
        >
          <figure>
            <img src="./assets/artists/mario.png" alt="Mario" loading="lazy" />
            <figcaption class="artist-overlay">
              <p>Lifestyle Creator / Photographer</p>
              <dl>
                <div><dt>Location</dt><dd>Guangdong</dd></div>
                <div><dt>Language</dt><dd>Mandarin · Cantonese · English</dd></div>
                <div><dt>Gender</dt><dd>Male</dd></div>
                <div><dt>Creative Talent</dt><dd>Lifestyle · Fashion · Sport</dd></div>
              </dl>
            </figcaption>
          </figure>
          <h2>Mario</h2>
        </article>
      </section>

      <p class="empty-state" hidden>
        No artists match these filters.
        <button type="button">Reset filters</button>
      </p>
    </main>

    <div class="language-menu" aria-hidden="true">
      <button type="button" data-language="EN">English</button>
      <button type="button" data-language="繁">繁體中文</button>
      <button type="button" data-language="简">简体中文</button>
    </div>
  </body>
</html>
