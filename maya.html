<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Maya is a GreenTomato AI Artist working across luxury fashion and contemporary visual culture."
    />
    <title>Maya — GreenTomato AI Artist</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./profile.css" />
  </head>
  <body class="profile-page">
    <header class="site-header">
      <a class="brand" href="./" aria-label="GreenTomato home">
        <img src="./assets/greentomato-logo.svg" alt="GreenTomato" />
      </a>

      <nav class="desktop-nav" aria-label="Primary navigation">
        <a class="is-current" href="./artists.html">Artists</a>
        <a href="./#work">Work</a>
        <a href="./#services">Services</a>
        <a href="./#about">About</a>
        <a href="./#contact">Contact</a>
        <a href="https://gtomato.com/" target="_blank" rel="noreferrer">
          Company <span aria-hidden="true">↗</span>
        </a>
      </nav>

      <a class="profile-back" href="./artists.html">
        All Artists <span aria-hidden="true">↗</span>
      </a>
    </header>

    <main class="profile-hero">
      <figure class="profile-cover">
        <img src="./assets/artists/maya.png" alt="Maya in a black tailored look" />
        <figcaption>
          <span>GreenTomato AI Artist</span>
          <span>Maya / 01</span>
        </figcaption>
      </figure>

      <section class="profile-intro" aria-labelledby="maya-name">
        <p class="profile-breadcrumb">
          <a href="./artists.html">Artists</a>
          <span aria-hidden="true">›</span>
          Maya
        </p>

        <div class="profile-title">
          <p>Luxury Fashion Artist</p>
          <h1 id="maya-name">Maya</h1>
        </div>

        <dl class="profile-facts">
          <div>
            <dt>Based in</dt>
            <dd>Paris · New York · Seoul</dd>
          </div>
          <div>
            <dt>Languages</dt>
            <dd>English · Korean</dd>
          </div>
          <div>
            <dt>Creative Talent</dt>
            <dd>Fashion · Art</dd>
          </div>
        </dl>

        <div class="profile-actions">
          <a class="profile-primary-action" href="./#contact">
            Start a project <span aria-hidden="true">↗</span>
          </a>
          <a class="profile-secondary-action" href="./artists.html">
            View all Artists
          </a>
        </div>
      </section>
    </main>
  </body>
</html>
